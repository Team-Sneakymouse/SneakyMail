name: SneakyMail
version: "${version}"
main: com.danidipp.sneakymail.SneakyMail
api-version: "26.2"
authors:
  - DaniDipp
description: "Paper plugin for sending and receiving mail and items"
dependencies:
  server:
    SneakyDB:
      load: BEFORE
      required: false
      join-classpath: true
    SneakyPocketbase:
      load: BEFORE
      required: true
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
    MagicSpells:
      load: BEFORE
      required: false
commands:
  mail:
    description: "Opens mail interface"
    usage: "/mail"
    permission: "sneakymail.mail"
  mailcheck:
    description: "Shows info about cashed mail"
    usage: "/mailcheck"
    permission: "sneakymail.admin"
